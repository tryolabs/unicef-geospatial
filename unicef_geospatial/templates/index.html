<!DOCTYPE html>
<html>
  <head>
    <title>Heatwave Analysis Chat</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 20px;
        display: flex;
        flex-direction: column;
        height: 100vh;
      }
      h1 {
        margin: 0 0 20px 0;
      }
      .container {
        display: flex;
        gap: 20px;
        flex: 1;
        min-height: 0; /* Important for proper scrolling */
      }
      #map-container {
        flex: 1;
        border: 1px solid #ccc;
        border-radius: 5px;
        overflow: hidden;
      }
      #map-frame {
        width: 100%;
        height: 100%;
        border: none;
      }
      .chat-section {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 400px;
      }
      #chat-container {
        flex: 1;
        border: 1px solid #ccc;
        overflow-y: auto;
        padding: 20px;
        margin-bottom: 20px;
        border-radius: 5px;
        min-height: 0; /* Important for proper scrolling */
      }
      .message {
        margin-bottom: 15px;
        padding: 10px;
        border-radius: 5px;
      }
      .user-message {
        background-color: #e3f2fd;
        margin-left: 20%;
      }
      .assistant-message {
        background-color: #f5f5f5;
        margin-right: 20%;
      }
      #input-container {
        display: flex;
        gap: 10px;
      }
      #question-input {
        flex-grow: 1;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 5px;
      }
      button {
        padding: 10px 20px;
        background-color: #2196f3;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
      }
      button:hover {
        background-color: #1976d2;
      }
    </style>
  </head>
  <body>
    <h1>Heatwave Analysis Chat</h1>
    <div class="container">
      <div id="map-container">
        <iframe id="map-frame" src="about:blank"></iframe>
      </div>
      <div class="chat-section">
        <div id="chat-container"></div>
        <div id="input-container">
          <input
            type="text"
            id="question-input"
            placeholder="Ask a question about heatwaves..."
          />
          <button onclick="askQuestion()">Send</button>
        </div>
      </div>
    </div>

    <script>
      function updateMap(htmlContent) {
        const mapFrame = document.getElementById("map-frame");
        const blob = new Blob([htmlContent], { type: "text/html" });
        mapFrame.src = URL.createObjectURL(blob);
      }

      function addMessage(content, isUser, isHtml = false, htmlContent = null) {
        const chatContainer = document.getElementById("chat-container");
        const messageDiv = document.createElement("div");
        messageDiv.className = `message ${
          isUser ? "user-message" : "assistant-message"
        }`;
        messageDiv.textContent = content;
        if (isHtml) {
          // Update the map instead of creating a new iframe
          updateMap(htmlContent);
        }

        chatContainer.appendChild(messageDiv);
        chatContainer.scrollTop = chatContainer.scrollHeight;
      }

      async function askQuestion() {
        const input = document.getElementById("question-input");
        const question = input.value.trim();

        if (!question) return;

        addMessage(question, true);
        input.value = "";

        try {
          const response = await fetch("/ask", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ question: question }),
          });

          const data = await response.json();
          addMessage(data.response, false, data.is_html, data.html_content);
        } catch (error) {
          console.error("Error:", error);
          addMessage(
            "Sorry, there was an error processing your request.",
            false
          );
        }
      }

      // Allow Enter key to submit
      document
        .getElementById("question-input")
        .addEventListener("keypress", function (e) {
          if (e.key === "Enter") {
            askQuestion();
          }
        });
    </script>
  </body>
</html>
