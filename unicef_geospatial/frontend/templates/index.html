<!DOCTYPE html>
<html>
  <head>
    <title>UNICEF Data Analysis Assistant</title>
    <link rel="stylesheet" href="/static/styles.css" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  </head>
  <body>
    <div class="header">
      <img
        src="https://upload.wikimedia.org/wikipedia/commons/5/57/UNICEF_Logo.png"
        alt="UNICEF Logo"
        class="logo"
      />
      <div>
        <h1>UNICEF Data Analysis Assistant</h1>
        <p class="subtitle">
          Explore global data through geospatial analysis, satellite imagery,
          and UNICEF indicators
        </p>
      </div>
    </div>

    <div class="data-sources">
      <div class="source-pill">🌍 Geospatial Data</div>
      <div class="source-pill">📊 UNICEF Data Warehouse</div>
    </div>

    <div class="container">
      <div id="map-container">
        <iframe id="map-frame" src="about:blank"></iframe>
      </div>
      <div class="chat-section">
        <div id="chat-container"></div>
        <div id="input-container">
          <input
            type="text"
            id="question-input"
            placeholder="Ask about global indicators, climate data, or request spatial analysis..."
          />
          <button onclick="askQuestion()">Send</button>
        </div>
      </div>
    </div>

    <script src="/static/main.js"></script>
  </body>
</html>
